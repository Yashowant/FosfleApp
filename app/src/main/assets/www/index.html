<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b1f">
<meta name="color-scheme" content="light dark">
<title>Fosfle</title>
<link rel="icon" href="/favicon/web-app-manifest-192x192.png">
<link rel="stylesheet" href="/vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="/css/app.css">
<script>
/* set theme before first paint so there is no flash */
(function(){try{var t=(JSON.parse(localStorage.getItem('fosfle.v1')||'{}').theme)||'system';
var d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>

<!-- ───────── Splash: a phosphor tube warming up ───────── -->
<div id="splash" aria-hidden="true">
  <div class="sp-scan"></div>
  <div class="sp-core">
    <div class="sp-word">
      <span style="--i:0">f</span><span style="--i:1">o</span><span style="--i:2">s</span><span style="--i:3">f</span><span style="--i:4" class="flick">l</span><span style="--i:5">e</span><i class="sp-caret"></i>
    </div>
    <div class="sp-trace"><b></b><u></u></div>
    <p class="sp-tag"><span>learn it</span><em>/</em><span>build it</span><em>/</em><span>ship it</span></p>
  </div>
  <div class="sp-foot"><span id="spStatus">warming up</span><span id="spPct">0%</span></div>
</div>

<main id="view" tabindex="-1" aria-live="polite"></main>

<nav id="tabs" aria-label="Main">
  <a href="#/home" data-tab="home"><i class="bi bi-house-door"></i><span>Home</span></a>
  <a href="#/course" data-tab="course"><i class="bi bi-braces-asterisk"></i><span>Course</span></a>
  <a href="#/blog" data-tab="blog"><i class="bi bi-journal-text"></i><span>Blog</span><i class="dot" id="blogDot" hidden></i></a>
  <a href="#/me" data-tab="me"><i class="bi bi-person"></i><span>You</span></a>
</nav>

<!-- ───────── Auth sheet ───────── -->
<div id="sheetBack" class="sheet-back" data-act="closeAuth"></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="grab"></div>
  <div class="auth-head">
    <img src="/favicon/web-app-manifest-192x192.png" alt="Fosfle" class="brand-logo">
    <div>
      <h2 id="authTitle">Welcome back</h2>
      <p class="sub" id="authSub">Sign in to keep your progress on every device.</p>
    </div>
  </div>
  <div class="seg" id="authSeg">
    <button type="button" data-act="authMode" data-mode="login" class="on">Sign in</button>
    <button type="button" data-act="authMode" data-mode="register">Create account</button>
  </div>
  <form id="authForm" novalidate>
    <label class="f f-name" hidden><span>Name</span><input id="aName" autocomplete="name" placeholder="Your name"></label>
    <label class="f"><span>Email</span><input id="aEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required></label>
    <label class="f"><span>Password</span>
      <div class="pw"><input id="aPass" type="password" autocomplete="current-password" placeholder="At least 6 characters" required>
      <button type="button" data-act="togglePw" aria-label="Show password"><i class="bi bi-eye"></i></button></div></label>
    <p class="err" id="authErr" role="alert"></p>
    <button class="btn primary block" id="authGo" type="submit">Sign in</button>
    <button class="link" type="button" data-act="resetPw" id="authReset">Forgot password?</button>
  </form>
  <div id="googleWrap"><div class="or"><span>or</span></div>
    <button type="button" class="btn ghost block" id="googleBtn" data-act="google"><i class="bi bi-google"></i> Continue with Google</button></div>
</section>

<div id="toast" role="status"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
